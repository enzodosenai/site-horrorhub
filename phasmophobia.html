<!DOCTYPE html>

<head>

    <title>Phasmophobia</title>

    <style>
         @font-face {
        font-family:'blood';
        src: url('./fonts/Bloodsoul\ PERSONAL\ USE\ ONLY!.ttf');
    }

        body{
            margin: 0;
            font-family: arial, sans-serif;
            background-color:#515151;
            color: white;
        }

        header{
            background-color: #1e1e1e;
            padding: 20px;
            text-align: center;
            border-bottom:  3px solid #ff0000;
        }

        header{
            color: #ff0000;
        }

        nav{
            text-align: center;
            padding: 15px;
        }

        nav a{
            color: white;
            text-decoration: none;

        }

        nav a:hover{
            color: #ff0000;
        }
        #game{
            display: flex;
            justify-content: center;
            gap: 20px;
            flex-wrap: wrap;
            padding: 20px;
        }

        .card{
            background-color: #1e1e1e;
            width: 550px;
            padding: 20px;
            border-radius: 10px;
            text-align: center;
            box-shadow: 0 0 80px #ff0000;
        }

        .card img{
            width: 500px;
            height: 450px;
            border-radius: 20px;
        }

        .card h3{
            color: #ff0000;
        }

        .btn-game{
            margin-top: 20px;
            background-color: #ff0000;
            color: #1e1e1e;
            padding: 12px;
            font-size: 16px;
            font-weight: bold;
            text-decoration: none;
            display: inline-block;
            transition: all 0.3s ease;
            border-radius: 15px;
        }

        .btn-game:hover{
            color: #ff0000;
            background-color: #1e1e1e;
            box-shadow: 0 0 15px #ff0000;
            transform: translateY(-2px);
        }
        .btn-game:active{
            transform: scale(00.95);
