<!DOCTYPE html>
<html lang="por-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HorrorHub</title>

    <style>

    @font-face {
        font-family:'blood';
        src: url('./fonts/Bloodsoul\ PERSONAL\ USE\ ONLY!.ttf');
    }

        body{
            margin: 0;
            font-family: arial, sans-serif;
            background-color: #515151;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .login{
            background-color: #1e1e1e;
            width: 425px;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 0 100px #ff0000;
            text-align: center;
        }

        h1{
            color: #ff0000;
        }

        p{
            color: #ffffff;
        }

        input{
            width: 100%;
            padding: 12px;
            margin-bottom: 12px;
            border: none;
            border-radius: 8px;
            box-sizing: border-box;
        }

        button{
            width: 80%;
            padding: 12px;
            border: none;
            border-radius: 8px;
            background: #ff0000;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover{
            background: #ff000079;
            font-size: 15px;
        }

        a{
            text-decoration: none;
            color: #ff0000;
        }

        .titulo{
            font-family: 'blood';
        }

    </style>
</head>
<body>

    <div class="login">

        <h1 class="titulo">🔪HorrorHub🕹️</h1>

        <p>Entre na sua conta</p>
        <form action="home.html">

            <input type="email" placeholder="Digite seu email">

            <input type="password" placeholder="Digite sua senha">

            <button type="submit"> Entrar </button>

        </form>

        <p>
            <a href="#">Criar Conta</a>
        </p>

    </div>
    
</body>
</html>
